/* Page-specific overrides for OLT MAC table */
:root { --olt-top-offset: 64px; }
@media (min-width: 782px) { :root { --olt-top-offset: 80px; } }
.main-content{
  overflow-x:hidden;
}
.olt-sticky-header{
  position: sticky;
  overflow-x: hidden;
  overflow-y: auto;
  top: var(--olt-top-offset);
  left: 0;
  right: 0;
  margin: 0 auto;
  max-width: 1200px;
  z-index: 1100;
  background: #f7f9fd;
  padding-bottom: 10px;
  box-shadow: 0 8px 14px rgba(0,0,0,0.06);
}
.olt-sticky-header::after{
  content:'';
  display:block;
  height:1px;
  background: linear-gradient(to right, transparent, rgba(0,0,0,.08), transparent);
  margin-top:4px;
}
.table-responsive { overflow-x: hidden; }
.accordion-collapse.show .table-responsive { overflow-x: auto; }
.olt-table-wrap{
  width:100%;
}
.accordion-collapse.show .olt-table-wrap{
  overflow-x:auto;
}

/* টেবিল কন্টেনার এরিয়া (Vertical Scroll) */
.olt-scroll-pane {
    max-height: 65vh; /* স্ক্রিনের ৬৫% উচ্চতা ব্যবহার করবে */
    overflow-y: auto !important;
    position: relative;
    border: 1px solid #dee2e6;
}

/* টেবিল র‍্যাপার (Horizontal Scroll) */
.olt-table-wrap {
    overflow-x: auto !important;
    width: 100%;
}

/* ফিক্সড টেবিল হেডার */
.olt-mac-table thead th {
    position: sticky;
    top: 0;
    z-index: 5; /* হেডারের উপরে থাকবে */
    background-color: #212529 !important;
    white-space: nowrap;
}

/* কলামের উইডথ কন্ট্রোল */
.olt-mac-table {
    min-width: 1250px; /* টেবিল যেন কলামগুলো চেপে না দেয় */
    table-layout: fixed;
}