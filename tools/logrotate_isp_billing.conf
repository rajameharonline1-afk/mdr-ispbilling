/var/www/isp_billing/storage/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 640 www-data www-data
    sharedscripts
    postrotate
        # Reload web server if needed to reopen log handles
        systemctl reload apache2 >/dev/null 2>&1 || true
    endscript
}
